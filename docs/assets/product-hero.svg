<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="568" viewBox="0 0 1120 568" role="img" aria-labelledby="title desc">
<title id="title">IntentOS. Let AI help. You stay in control.</title>
<desc id="desc">Free software that helps people stay in control of what AI does.</desc>
<defs>
