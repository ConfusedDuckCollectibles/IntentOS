  <linearGradient id="m" x2="1" y2=".6"><stop stop-color="#b097ff"/><stop offset=".6" stop-color="#a2ceff"/><stop offset="1" stop-color="#75f5cf"/></linearGradient>
  <radialGradient id="v"><stop stop-color="#6d46f9" stop-opacity=".47"/><stop offset="1" stop-color="#6d46f9" stop-opacity="0"/></radialGradient>
  <pattern id="dots" width="22" height="22" patternUnits="userSpaceOnUse"><circle cx="1.5" cy="1.5" r="1.1" fill="#a0a8e4" opacity=".19"/></pattern>
  <clipPath id="clip"><rect width="1120" height="568" rx="30"/></clipPath>
</defs>
