name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Check out source
        uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0
        with:
          persist-credentials: false
      - name: Set up Node
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version-file: .node-version
          package-manager-cache: false
      - name: Install locked development dependencies
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Check TypeScript
        run: npm run typecheck
      - name: Run tests
        run: npm test
      - name: Run offline demo
        run: npm run demo -- "${{ runner.temp }}/intentos-ci"
      - name: Run lost-reply demo
        run: npm run demo:queue -- "${{ runner.temp }}/intentos-ci"
      - name: Run offline backup and restore demo
        run: npm run demo:storage
