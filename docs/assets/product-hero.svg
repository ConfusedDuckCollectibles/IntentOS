 </g>
 <text x="55" y="157" fill="#cfbfff" font-family="monospace" font-size="22" font-weight="700" letter-spacing="2">FREE, OPEN-SOURCE SOFTWARE</text>
 <text x="49" y="247" fill="#f7f4ff" font-weight="800" font-size="72" letter-spacing="-2">Let AI help.</text>
 <text x="49" y="323" fill="#f7f4ff" font-weight="800" font-size="72" letter-spacing="-2">You stay</text>
 <text x="49" y="407" fill="url(#m)" font-weight="800" font-size="76" letter-spacing="-3">in control.</text>
 <text x="56" y="477" fill="#d2d8ec" font-size="29">Approve the plan. See what happened.</text>
 <text x="55" y="554" fill="#b9b7d4" font-size="17" font-family="monospace" letter-spacing="1">EARLY DEMO  /  NO ACCOUNT REQUIRED</text>
